<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片编辑 - StepFun 控制管理后台</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/realtime.css">
  <link rel="stylesheet" href="/css/image.css">
  <link rel="stylesheet" href="/css/image-edit.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-left">
        <a href="https://platform.stepfun.com/docs/zh/welcome" target="_blank" class="logo" title="StepFun 文档中心">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          <span>StepFun控制管理后台</span>
        </</a>
        <nav class="nav-tabs">
          <a href="/" class="nav-tab">知识库管理</a>
          <a href="/realtime.html" class="nav-tab">实时语音对话</a>
          <a href="/step-realtime.html" class="nav-tab">中转测试</a>
          <a href="/vision.html" class="nav-tab">图片理解</a>
          <a href="/image.html" class="nav-tab">图片生成</a>
          <a href="/image-edit.html" class="nav-tab active">图片编辑</a>
          <a href="/video.html" class="nav-tab">视频理解</a>
          <a href="/tts.html" class="nav-tab">音频合成</a>
          <a href="/voice-clone.html" class="nav-tab">音色复刻</a>
          <a href="/chat.html" class="nav-tab">聊天对话</a>
        </nav>
      </div>
      <div class="header-right">
        <span class="api-badge" id="apiStatus">检查中...</span>
      </div>
    </header>

    <main class="ig-main">
      <aside class="ig-sidebar">
        <div class="rt-panel">
          <h3 class="rt-panel-title">编辑参数</h3>
          <div class="form-group">
            <label>推理步数 steps（1~50）</label>
            <input type="number" id="cfgSteps" class="form-input form-input-sm" value="8" min="1" max="50">
          </div>
          <div class="form-group">
            <label>CFG scale（1.0~10.0）</label>
            <input type="number" id="cfgCfgScale" class="form-input form-input-sm" value="1.0" min="1" step="0.1">
            <p class="form-hint">=1.0 时负面提示词不生效</p>
          </div>
          <div class="form-group">
            <label class="rt-switch-row">
              <span>文字场景优化 text_mode</span>
              <input type="checkbox" id="cfgTextMode">
            </label>
          </div>
        </div>

        <div class="rt-panel">
          <h3 class="rt-panel-title">种子 seed</h3>
          <div class="form-group">
            <label class="rt-switch-row">
              <span>指定 seed</span>
              <input type="checkbox" id="cfgUseSeed" onchange="toggleSeedInput()">
            </label>
          </div>
          <div class="form-group">
            <input type="number" id="cfgSeed" class="form-input form-input-sm" value="0" min="0" max="2147483647" disabled>
          </div>
        </div>

        <div class="rt-panel">
          <h3 class="rt-panel-title">操作</h3>
          <button class="btn btn-ghost btn-sm" onclick="clearAll()" style="width:100%;">清空全部</button>
        </div>
      </aside>

      <section class="ie-canvas">
        <!-- 上传区（未上传时显示） -->
        <div class="ie-upload-card" id="uploadCard">
          <div class="vd-upload-zone" id="uploadZone">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.4;">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <p class="upload-text">点击或拖拽图片到此处</p>
            <p class="upload-hint">JPG / PNG / WebP，最大 4096×4094</p>
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display:none;">
          </div>
        </div>

        <!-- 编辑器（上传后显示） -->
        <div class="ie-editor-card" id="editorCard" style="display:none;">
          <div class="ie-editor-row">
            <!-- 左侧：原图 -->
            <div class="ie-side">
              <div class="ie-side-label">原图</div>
              <div class="ie-image-wrap">
                <img id="originalImg" alt="原图">
              </div>
              <button class="btn btn-ghost btn-sm" onclick="document.getElementById('fileInput').click()" style="margin-top:8px;width:100%;">换一张</button>
            </div>

            <!-- 中间：编辑控件 -->
            <div class="ie-controls">
              <div class="form-group">
                <label>编辑指令 prompt <span class="required">*</span></label>
                <textarea id="prompt" class="form-input" rows="4" maxlength="512" placeholder="描述你想对图片做的修改，如：变成一只英短猫..."></textarea>
                <div class="ig-prompt-meta"><span id="promptCount">0</span>/512</div>
              </div>
              <details class="ig-advanced">
                <summary>高级：负面提示词</summary>
                <textarea id="negativePrompt" class="form-input" rows="2" maxlength="512" placeholder="不希望出现的元素"></textarea>
              </details>
              <div class="ie-actions">
                <button class="btn btn-primary" id="editBtn" onclick="edit()">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"/>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/>
                  </svg>
                  开始编辑
                </button>
              </div>
            </div>

            <!-- 右侧：最新结果 -->
            <div class="ie-side">
              <div class="ie-side-label">结果</div>
              <div class="ie-image-wrap" id="resultWrap">
                <div class="ie-result-empty">点击「开始编辑」生成结果</div>
                <img id="resultImg" alt="结果" style="display:none;">
              </div>
              <div class="ie-result-actions" id="resultActions" style="display:none;">
                <button class="btn btn-ghost btn-sm" onclick="viewLatest()">查看</button>
                <button class="btn btn-ghost btn-sm" onclick="downloadLatest()">下载</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 历史 -->
        <div class="ig-gallery-wrap" id="historyWrap" style="display:none;">
          <div class="ig-gallery-header">
            <h3>编辑历史</h3>
            <span class="ig-gallery-count" id="historyCount">0</span>
          </div>
          <div class="ie-history" id="history"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- 大图查看 -->
  <div id="imageViewer" class="vs-viewer" style="display:none;" onclick="closeViewer()">
    <img id="viewerImg" alt="">
  </div>

  <div id="toast" class="toast" style="display:none;"></div>

  <script src="/js/image-edit.js"></script>
</body>
</html>
