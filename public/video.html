<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频理解 - StepFun 控制管理后台</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/realtime.css">
  <link rel="stylesheet" href="/css/vision.css">
  <link rel="stylesheet" href="/css/video.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <a href="https://platform.stepfun.com/docs/zh/welcome" target="_blank" class="logo" title="StepFun 文档中心">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          <span>StepFun控制管理后台</span>
        </</a>
        <nav class="nav-tabs">
          <a href="/" class="nav-tab">知识库管理</a>
          <a href="/realtime.html" class="nav-tab">实时语音对话</a>
          <a href="/step-realtime.html" class="nav-tab">中转测试</a>
          <a href="/vision.html" class="nav-tab">图片理解</a>
          <a href="/image.html" class="nav-tab">图片生成</a>
          <a href="/image-edit.html" class="nav-tab">图片编辑</a>
          <a href="/video.html" class="nav-tab active">视频理解</a>
          <a href="/tts.html" class="nav-tab">音频合成</a>
          <a href="/voice-clone.html" class="nav-tab">音色复刻</a>
          <a href="/chat.html" class="nav-tab">聊天对话</a>
        </nav>
      </div>
      <div class="header-right">
        <span class="api-badge" id="apiStatus">检查中...</span>
      </div>
    </header>

    <main class="rt-main">
      <!-- 左侧设置面板 -->
      <aside class="rt-sidebar">
        <div class="rt-panel">
          <h3 class="rt-panel-title">模型配置</h3>
          <div class="form-group">
            <label>模型</label>
            <select id="cfgModel" class="form-input form-input-sm">
              <option value="step-3.7-flash">step-3.7-flash（推荐）</option>
              <option value="step-1o-turbo-vision">step-1o-turbo-vision</option>
            </select>
          </div>
          <div class="form-group">
            <label>系统提示词</label>
            <textarea id="cfgSystem" class="form-input form-input-sm" rows="3" placeholder="你是一个专业的视频内容分析助手...">你是一个专业的视频内容分析助手，请仔细观察视频内容，用中文详细、准确地回答用户的问题。</textarea>
          </div>
          <div class="form-group">
            <label>温度</label>
            <input type="number" id="cfgTemperature" class="form-input form-input-sm" value="0.7" min="0" max="2" step="0.1">
          </div>
          <div class="form-group">
            <label>最大输出 tokens</label>
            <input type="number" id="cfgMaxTokens" class="form-input form-input-sm" value="1024" min="64" max="8192" step="64">
          </div>
        </div>

        <div class="rt-panel">
          <h3 class="rt-panel-title">视频输入</h3>
          <div class="form-group">
            <label>来源</label>
            <select id="cfgSource" class="form-input form-input-sm" onchange="onSourceChange()">
              <option value="url">外部 URL（默认）</option>
              <option value="file">本地上传</option>
              <option value="stepfile">stepfile://（Files API）</option>
            </select>
          </div>

          <!-- 文件上传 -->
          <div id="sourceFile" class="form-group">
            <div class="vd-upload-zone" id="uploadZone">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.4;">
                <path d="M23 7l-7 5 7 5V7z"/>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
              </svg>
              <p class="upload-text">点击或拖拽视频到此处</p>
              <p class="upload-hint">MP4 / MOV / MKV，建议 ≤ 100MB（最大 128MB）</p>
              <input type="file" id="fileInput" accept="video/mp4,video/quicktime,video/x-matroska" style="display:none;">
            </div>
          </div>

          <!-- URL -->
          <div id="sourceUrl" class="form-group" style="display:none;">
            <label>外部视频地址</label>
            <input type="url" id="videoUrl" class="form-input form-input-sm" placeholder="https://example.com/video.mp4">
            <p class="form-hint">支持 MP4/MOV/MKV；也可直接粘贴到下方问题框自动识别</p>
          </div>

          <!-- stepfile -->
          <div id="sourceStepfile" class="form-group" style="display:none;">
            <label>File ID（来自 Files API 上传）</label>
            <input type="text" id="videoFileId" class="form-input form-input-sm" placeholder="file-xxxxxx">
            <p class="form-hint">使用 Files API 上传（purpose=storage），速度更快</p>
          </div>

          <div id="videoPreview" class="vd-preview" style="display:none;"></div>
          <button class="btn btn-ghost btn-sm" id="clearVideoBtn" style="width:100%;display:none;margin-top:8px;" onclick="clearVideo()">移除视频</button>
        </div>

        <div class="rt-panel">
          <h3 class="rt-panel-title">操作</h3>
          <button class="btn btn-ghost btn-sm" onclick="clearConversation()" style="width:100%;">清空对话</button>
          <p class="form-hint" style="margin-top:8px;">视频理解耗时较长（需下载+审核视频），请耐心等待</p>
        </div>
      </aside>

      <!-- 右侧对话区 -->
      <section class="rt-conversation">
        <div class="rt-transcript" id="transcript">
          <div class="rt-empty">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3;margin-bottom:12px;">
              <path d="M23 7l-7 5 7 5V7z"/>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
            <p>上传视频或输入视频地址，提问视频内容</p>
            <p class="rt-empty-hint">支持 MP4 / MOV / MKV</p>
          </div>
        </div>

        <div class="rt-controls">
          <div class="vd-input-row">
            <textarea id="textInput" class="form-input vd-input" placeholder="描述对视频的要求或问题..." rows="1"></textarea>
            <button class="btn btn-primary" id="sendBtn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
              发送
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" style="display:none;"></div>

  <script src="/js/video.js"></script>
</body>
</html>
