<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天对话 - StepFun 控制管理后台</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/realtime.css">
  <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <a href="https://platform.stepfun.com/docs/zh/welcome" target="_blank" class="logo" title="StepFun 文档中心">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          <span>StepFun控制管理后台</span>
        </a>
        <nav class="nav-tabs">
          <a href="/" class="nav-tab">知识库管理</a>
          <a href="/realtime.html" class="nav-tab">实时语音对话</a>
          <a href="/step-realtime.html" class="nav-tab">中转测试</a>
          <a href="/vision.html" class="nav-tab">图片理解</a>
          <a href="/image.html" class="nav-tab">图片生成</a>
          <a href="/image-edit.html" class="nav-tab">图片编辑</a>
          <a href="/video.html" class="nav-tab">视频理解</a>
          <a href="/tts.html" class="nav-tab">音频合成</a>
          <a href="/voice-clone.html" class="nav-tab">音色复刻</a>
          <a href="/chat.html" class="nav-tab active">聊天对话</a>
        </nav>
      </div>
      <div class="header-right">
        <span class="api-badge checking" id="apiStatus">检查中...</span>
      </div>
    </header>

    <main class="rt-main">
      <!-- 左侧设置面板 -->
      <aside class="rt-sidebar">
        <!-- 模型动态配置 -->
        <div class="rt-panel">
          <h3 class="rt-panel-title">模型配置</h3>
          <div class="form-group">
            <label>模型</label>
            <select id="cfgModel" class="form-input form-input-sm"></select>
            <p class="form-hint" id="modelHint">从清单选择，或在「自定义模型」中输入任意 ID</p>
          </div>
          <div class="form-group">
            <label>自定义模型（可填任意 ID）</label>
            <input type="text" id="cfgModelCustom" class="form-input form-input-sm" placeholder="例如：step-3.7-flash-think">
            <p class="form-hint">修改后会自动选中「自定义」并刷新预设</p>
          </div>
          <div class="form-group">
            <label>温度 temperature</label>
            <input type="number" id="cfgTemperature" class="form-input form-input-sm" value="0.7" min="0" max="2" step="0.1">
          </div>
          <div class="form-group">
            <label>最大 token（可选）</label>
            <input type="number" id="cfgMaxTokens" class="form-input form-input-sm" placeholder="留空由模型决定" min="1">
          </div>
          <div class="form-group">
            <label class="rt-switch-row">
              <span>流式输出（SSE）</span>
              <input type="checkbox" id="cfgStream" checked>
            </label>
          </div>
        </div>

        <!-- 提示词动态配置 -->
        <div class="rt-panel">
          <h3 class="rt-panel-title">提示词（System Prompt）</h3>
          <div class="form-group">
            <div class="rt-preset-row">
              <select id="cfgPresetSelect" class="form-input form-input-sm">
                <option value="">（未选择预设）</option>
              </select>
              <button class="btn btn-ghost btn-sm" id="cfgPresetApply" title="加载选中的预设">加载</button>
              <button class="btn btn-ghost btn-sm" id="cfgPresetDel" title="删除选中的预设">删除</button>
            </div>
            <p class="form-hint">预设按模型隔离，切换模型自动加载对应预设</p>
          </div>
          <div class="form-group">
            <label>当前系统提示词</label>
            <textarea id="cfgSystem" class="form-input form-input-sm rt-textarea-tall" rows="10" placeholder="不填则不发送 system 角色（一般不推荐）"></textarea>
            <p class="form-hint">
              <span id="cfgSystemBadge">未保存</span>
              <button class="btn btn-ghost btn-sm rt-inline-btn" id="cfgSystemSave">保存为当前模型预设</button>
              <button class="btn btn-ghost btn-sm rt-inline-btn" id="cfgSystemReset">重置</button>
            </p>
          </div>
          <div class="form-group">
            <p class="form-hint">
              内置模板：
              <a href="javascript:void(0)" data-tpl="assist">通用助手</a> ·
              <a href="javascript:void(0)" data-tpl="coder">代码助手</a> ·
              <a href="javascript:void(0)" data-tpl="writer">中文写手</a> ·
              <a href="javascript:void(0)" data-tpl="translator">中英翻译</a> ·
              <a href="javascript:void(0)" data-tpl="empty">清空</a>
            </p>
          </div>
        </div>

        <!-- 操作 -->
        <div class="rt-panel">
          <h3 class="rt-panel-title">操作</h3>
          <button class="btn btn-ghost btn-sm" id="clearBtn" style="width:100%;">清空对话</button>
          <button class="btn btn-ghost btn-sm" id="exportBtn" style="width:100%;margin-top:8px;">导出对话（Markdown）</button>
          <p class="form-hint" id="turnCount" style="margin-top:8px;">当前对话 0 轮</p>
        </div>
      </aside>

      <!-- 右侧对话区 -->
      <section class="rt-conversation">
        <!-- 状态条 -->
        <div class="rt-statusbar">
          <div class="rt-state">
            <span class="rt-state-dot"></span>
            <span id="nowModel">未连接</span>
          </div>
          <div class="rt-statusbar-actions">
            <button class="btn btn-ghost btn-sm" id="stopBtn" disabled>停止</button>
          </div>
        </div>

        <!-- 对话记录 -->
        <div class="rt-transcript" id="transcript">
          <div class="rt-empty">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3;margin-bottom:12px;">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <p>和 Step Plan 模型对话</p>
            <p class="rt-empty-hint">左侧切换模型 / 编辑提示词，右侧输入消息开始对话</p>
          </div>
        </div>

        <!-- 输入区 -->
        <div class="rt-controls">
          <div class="rt-text-row">
            <textarea id="textInput" class="form-input chat-input" placeholder="说点什么...（Shift+Enter 换行，Enter 发送）" rows="2" onkeydown="onInputKeydown(event)"></textarea>
          </div>
          <div class="rt-text-row" style="margin-top:8px;">
            <button class="btn btn-primary" id="sendBtn" style="flex:1;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
              <span id="sendBtnText">发送</span>
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" style="display:none;"></div>

  <script src="/js/chat.js"></script>
</body>
</html>
