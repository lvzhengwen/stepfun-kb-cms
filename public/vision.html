<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片理解 - StepFun 控制管理后台</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/realtime.css">
  <link rel="stylesheet" href="/css/vision.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <a href="https://platform.stepfun.com/docs/zh/welcome" target="_blank" class="logo" title="StepFun 文档中心">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          <span>StepFun控制管理后台</span>
        </</a>
        <nav class="nav-tabs">
          <a href="/" class="nav-tab">知识库管理</a>
          <a href="/realtime.html" class="nav-tab">实时语音对话</a>
          <a href="/step-realtime.html" class="nav-tab">中转测试</a>
          <a href="/vision.html" class="nav-tab active">图片理解</a>
          <a href="/image.html" class="nav-tab">图片生成</a>
          <a href="/image-edit.html" class="nav-tab">图片编辑</a>
          <a href="/video.html" class="nav-tab">视频理解</a>
          <a href="/tts.html" class="nav-tab">音频合成</a>
          <a href="/voice-clone.html" class="nav-tab">音色复刻</a>
        </nav>
      </div>
      <div class="header-right">
        <span class="api-badge" id="apiStatus">检查中...</span>
      </div>
    </header>

    <main class="rt-main">
      <!-- 左侧设置面板 -->
      <aside class="rt-sidebar">
        <div class="rt-panel">
          <h3 class="rt-panel-title">模型配置</h3>
          <div class="form-group">
            <label>模型</label>
            <select id="cfgModel" class="form-input form-input-sm">
              <option value="step-1o-turbo-vision">step-1o-turbo-vision（推荐，最强视觉理解）</option>
              <option value="step-3.7-flash">step-3.7-flash（快速，支持图片）</option>
            </select>
          </div>
          <div class="form-group">
            <label>理解精度 detail</label>
            <select id="cfgDetail" class="form-input form-input-sm">
              <option value="high">high（细节完整，token 消耗高）</option>
              <option value="low">low（每张约 169 token，响应快）</option>
            </select>
            <p class="form-hint">step-1o-turbo-vision 官方推荐 high</p>
          </div>
          <div class="form-group">
            <label>系统提示词</label>
            <textarea id="cfgSystem" class="form-input form-input-sm" rows="3" placeholder="你是一个专业的图片分析助手...">你是一个专业的图片分析助手，请仔细观察图片内容，用中文详细、准确地回答用户的问题。</textarea>
          </div>
          <div class="form-group">
            <label>温度</label>
            <input type="number" id="cfgTemperature" class="form-input form-input-sm" value="0.7" min="0" max="2" step="0.1">
          </div>
        </div>

        <div class="rt-panel">
          <h3 class="rt-panel-title">操作</h3>
          <button class="btn btn-ghost btn-sm" onclick="clearConversation()" style="width:100%;">清空对话</button>
          <p class="form-hint" style="margin-top:8px;">支持 JPG / PNG / GIF / WebP，多图最多 10 张；图片会自动压缩后上传</p>
        </div>
      </aside>

      <!-- 右侧对话区 -->
      <section class="rt-conversation">
        <!-- 对话记录 -->
        <div class="rt-transcript" id="transcript">
          <div class="rt-empty">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3;margin-bottom:12px;">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <p>上传图片并提问，体验 StepFun 图片理解能力</p>
            <p class="rt-empty-hint">支持点击选择 / 拖拽 / 直接粘贴截图</p>
          </div>
        </div>

        <!-- 图片预览区 -->
        <div class="vs-preview-bar" id="previewBar" style="display:none;"></div>

        <!-- 输入区 -->
        <div class="rt-controls">
          <div class="vs-input-row">
            <button class="btn vs-attach-btn" id="attachBtn" title="上传图片">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
            </button>
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/gif,image/webp" multiple style="display:none;">
            <textarea id="textInput" class="form-input vs-input" placeholder="描述图片或输入问题，支持粘贴截图..." rows="1"></textarea>
            <button class="btn btn-primary" id="sendBtn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
              发送
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 图片查看大图 -->
  <div id="imageViewer" class="vs-viewer" style="display:none;" onclick="this.style.display='none'">
    <img id="viewerImg" alt="查看大图">
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" style="display:none;"></div>

  <script src="/js/vision.js"></script>
</body>
</html>
